<!DOCTYPE html>
<!-- SLMP - Simple Local Music Player | Copyright (C) 2026 catastrophic-impact | SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' http://127.0.0.1:*; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
  <title>Simple Local Music Player</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="btn-up" class="icon-btn" title="Parent folder" data-icon="up"></button>
      <div id="path-display" class="crumbs">/</div>
      <button id="btn-list" class="icon-btn toggle-btn active" title="Hide file list" data-icon="list"></button>
      <button id="btn-settings" class="icon-btn" title="Settings" data-icon="settings"></button>
      <button id="btn-compact" class="icon-btn" title="Compact mode" data-icon="compact"></button>
    </header>

    <main class="browser-container">
      <ul id="file-list"></ul>
    </main>

    <footer class="player-bar">
      <!-- Info: title + folder -->
      <div class="pb-info">
        <div id="now-playing"><span class="marquee-inner"></span></div>
        <div id="now-folder"></div>
      </div>

      <!-- Transport (centered) with volume at the right edge -->
      <div class="pb-transport">
        <div class="controls">
          <button id="btn-shuffle" class="icon-btn toggle-btn" title="Shuffle (S)" data-icon="shuffle"></button>
          <button id="btn-prev" class="icon-btn" title="Previous Track (P)" data-icon="prev"></button>
          <button id="btn-play" title="Play / Pause (Space)" data-icon="play"></button>
          <button id="btn-next" class="icon-btn" title="Next Track (N)" data-icon="next"></button>
          <button id="btn-repeat" class="icon-btn toggle-btn" title="Repeat (R)" data-icon="repeat"></button>
        </div>
        <div class="volume-container">
          <button id="vol-icon" class="icon-btn" title="Mute" data-icon="volume"></button>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
      </div>

      <!-- Progress -->
      <div class="progress-container">
        <span id="time-elapsed" class="time-stamp">00:00</span>
        <div class="slider-wrap">
          <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.1">
          <span id="seek-tip" hidden>0:00</span>
        </div>
        <span id="time-duration" class="time-stamp">00:00</span>
      </div>

      <!-- Mini visualizer (doubles as the screensaver menu button) -->
        <div class="mini-viz-wrap">
          <div id="mini-viz" role="button" tabindex="0" title="Screensaver">
            <div id="mini-viz-stage"></div>
            <span id="mini-viz-label"><i data-icon="monitor"></i>Screensaver</span>
          </div>
          <div id="screensaver-menu" hidden>
            <div id="screensaver-list"></div>
            <div class="menu-divider"></div>
            <button data-action="window"><i data-icon="window"></i>Open window</button>
            <button data-action="fullscreen"><i data-icon="fullscreen"></i>Open fullscreen</button>
          </div>
        </div>
    </footer>

    <!-- Settings Panel (built from the config schema by settings.js) -->
    <section id="settings-panel" hidden>
      <header class="settings-header">
        <h2>Settings</h2>
        <button id="btn-settings-close" class="icon-btn" title="Close (Esc)" data-icon="close"></button>
      </header>
      <nav id="settings-tabs"></nav>
      <div id="settings-body"></div>
    </section>
  </div>

  <audio id="audio-engine"></audio>
  <script src="icons.js"></script>
  <script src="../node_modules/pixi.js/dist/pixi.min.js"></script>
  <!-- Lets pixi run under this page's strict CSP (no eval) -->
  <script src="../node_modules/pixi.js/dist/packages/unsafe-eval.min.js"></script>
  <script src="partymode/saver-common.js"></script>
  <script src="partymode/bars.js"></script>
  <script src="partymode/raindrops.js"></script>
  <script src="partymode/chaos.js"></script>
  <script src="partymode/journey.js"></script>
  <script src="partymode/space.js"></script>
  <script src="partymode/hungry.js"></script>
  <script src="partymode/blackholes.js"></script>
  <script src="spectrum.js"></script>
  <script src="renderer.js" defer></script>
  <script src="settings.js" defer></script>
</body>
</html>
